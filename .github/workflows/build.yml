name: Build Kelp Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Make Gradle executable
        working-directory: greenmod
        run: chmod +x gradlew

      - name: Build mod
        working-directory: greenmod
        run: ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: greenmod-jar
          path: greenmod/build/libs/*.jar
